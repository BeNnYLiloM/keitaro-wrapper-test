name: keitaro-wrapper

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: keitaro
      POSTGRES_DB: keitaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432" # снаружи 5433, чтобы не конфликтовать с локальным Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@db:5432/keitaro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
